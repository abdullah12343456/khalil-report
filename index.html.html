<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقرير النشاط اليومي – الخليل باك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap">
<style>
:root{--bg:#f4f8f9;--card:#fff;--tx:#1f3044;--mut:#5d6f80;--bd:#cfdbe2;--teal:#0a8f98;--navy:#1f3044;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--card:#18283a;--tx:#e8f0f5;--mut:#9db0c0;--bd:#2d4257}}
:root[data-theme="dark"]{--bg:#0f1a24;--card:#18283a;--tx:#e8f0f5;--mut:#9db0c0;--bd:#2d4257}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;border-bottom:4px solid var(--teal)}
.top img{height:64px}.top h1{margin:0;font-size:19px}.top p{margin:0;color:var(--teal);font-weight:700;font-size:14px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-top:12px;overflow:hidden}
.sec h2{margin:0;padding:8px 14px;font-size:16px;background:var(--navy);color:#fff;border-right:6px solid var(--teal)}
.g{display:grid;grid-template-columns:1fr;gap:10px;padding:12px 14px}
@media(min-width:520px){.g.two{grid-template-columns:1fr 1fr}}
label{display:block;font-size:14px;font-weight:700;color:var(--teal);margin-bottom:3px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.note{margin-top:12px;padding:10px 14px;border:1px dashed var(--teal);border-radius:12px;font-weight:700;font-size:14px;text-align:center}
.bar{position:fixed;inset-inline:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--teal);color:#fff;width:100%}
button.alt{background:var(--navy)}button.wa{background:#1e9e55}
.bar button{max-width:612px;display:block;margin:0 auto}
#res{display:none}#res img{width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff}
.btns{display:grid;gap:8px;margin-top:10px}
.err{color:#d33;font-size:14px;margin-top:8px;text-align:center;min-height:1em}
#sheet{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#1f3044;direction:rtl;font-family:Cairo,Tahoma,sans-serif;font-size:13px;line-height:1.4;padding:30px 36px}
#sheet .h{display:flex;align-items:center;gap:18px;border-bottom:7px solid #0a8f98;padding-bottom:8px}
#sheet .h img{height:92px}#sheet .h div{flex:1;text-align:center}
#sheet h1{margin:0;font-size:30px}#sheet .h p{margin:0;color:#0a8f98;font-weight:700;font-size:15px}
#sheet h2{margin:14px 0 6px;font-size:15px;background:#1f3044;color:#fff;padding:3px 12px;border-radius:5px;border-right:7px solid #0a8f98}
#sheet .gg{display:grid;gap:6px 18px}
#sheet .c small{display:block;color:#0a8f98;font-weight:700;font-size:11.5px}
#sheet .c span{display:block;border-bottom:1px solid #9aa8b4;min-height:24px;white-space:pre-wrap;word-break:break-word;padding:0 2px}
#sheet .c.a span{min-height:40px}
#sheet .n{margin-top:14px;border:2px dashed #0a8f98;background:#eef7f8;padding:7px 12px;border-radius:7px;font-weight:700;text-align:center}
</style></head><body>

function build(){
let h='<div class="h"><img src="'+LOGO+'"><div><h1>تقرير النشاط اليومي</h1><p>الخليل باك</p></div></div>';let n=0;
S.forEach(([t,c,fs])=>{h+='<h2>'+t+'</h2><div class="gg" style="grid-template-columns:'+(c==2?'1fr 1fr':'1fr')+'">';
fs.forEach(([l,ty])=>{const v=$(ids[n++]).value.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));h+='<div class="c'+(ty=='a'?' a':'')+'"><small>'+l+'</small><span>'+v+'</span></div>'});h+='</div>'});
h+='<div class="n">يرجى تسجيل كل عميل جديد في سجل العملاء الرسمي للشركة، وعدم الاكتفاء بإرساله في التقرير فقط.</div>';
$('sheet').innerHTML=h}
function fname(e){return 'تقرير_'+(nm||'مندوب').replace(/\s+/g,'_')+'_'+$('x0').value+'.'+e}
const blobOf=()=>new Promise(r=>cv.toBlob(r,'image/png'));
function pdf(){const J=window.jspdf.jsPDF;const d=new J({unit:'mm',format:'a4'});const r=cv.height/cv.width;let w=210,h=210*r;if(h>297){h=297;w=297/r}
d.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',(210-w)/2,0,w,h);return d}
function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('go').onclick=async()=>{
const e=$('err');e.textContent='';
if(![1,2,3].every(i=>$('x'+i).value.trim())){e.textContent='اكتب اسمك وكودك والمنطقة الأول.';window.scrollTo({top:0,behavior:'smooth'});return}
if(!window.html2canvas||!window.jspdf){e.textContent='تعذّر تحميل أدوات الإنشاء. تأكد من الإنترنت وجرّب تاني.';return}
try{mem.forEach(i=>localStorage.setItem('kb_'+i,$(i).value))}catch(x){}
nm=$('x1').value.trim();$('go').disabled=true;$('go').textContent='جاري الإنشاء...';
try{build();await document.fonts.ready;cv=await html2canvas($('sheet'),{scale:2,backgroundColor:'#fff',useCORS:true});
$('pv').src=cv.toDataURL('image/jpeg',.85);$('res').style.display='block';$('res').scrollIntoView({behavior:'smooth'})}
catch(x){e.textContent='حصلت مشكلة في إنشاء الورقة. جرّب تاني.'}
$('go').disabled=false;$('go').textContent='إنشاء الورقة'};
$('bp').onclick=()=>pdf().save(fname('pdf'));
$('bi').onclick=async()=>save(await blobOf(),fname('png'));
$('bs').onclick=async()=>{const b=pdf().output('blob');const f=new File([b],fname('pdf'),{type:'application/pdf'});
try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'تقرير النشاط اليومي – الخليل باك'});else{save(b,f.name);$('err').textContent='اتحمّل الملف. ابعته من الواتساب.'}}catch(x){}};
$('bw').onclick=()=>window.open('https://wa.me/'+WA+'?text='+encodeURIComponent('تقرير النشاط اليومي – '+nm+' – '+$('x0').value),'_blank');
$('bn').onclick=()=>{ids.forEach(i=>{if(!mem.includes(i)&&i!='x0')$(i).value=''});$('x0').value=today();$('res').style.display='none';window.scrollTo({top:0,behavior:'smooth'})};
</script></body></html>
